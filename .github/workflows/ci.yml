name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  CI:
    runs-on: ubuntu-latest

    container:
      image: rootproject/root:6.30.06-ubuntu22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m ensurepip --upgrade || true
          apt-get update
          apt-get install -y git ca-certificates python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run CI test
        run: |
          python3 run/ci/ci_test.py

      - name: Upload full ONNX model
        uses: actions/upload-artifact@v4
        with:
          name: tpcpid-full-onnx
          path: output/**/networks/network_full/net_onnx_full.onnx
          if-no-files-found: error

  O2Physics-PID:
    runs-on: ubuntu-latest
    needs: CI

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download full ONNX model
        uses: actions/download-artifact@v4
        with:
          name: tpcpid-full-onnx
          path: run/ci/o2physics_model

      - name: Setup CVMFS
        uses: cvmfs-contrib/github-action-cvmfs@v5
        with:
          cvmfs_repositories: "alice.cern.ch"

      - name: Run O2Physics PID workflow
        run: |
          source <(/cvmfs/alice.cern.ch/bin/alienv printenv O2Physics/latest)
          ONNX_FILE="$(find run/ci/o2physics_model -name net_onnx_full.onnx -print -quit)"
          test -n "$ONNX_FILE"
          python3 run/ci/o2physics_pid_test.py \
            --required \
            --onnx "$ONNX_FILE"
